services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-appuser}:${DB_PASSWORD:-apppass}@db:5432/${DB_NAME:-appenglish}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-openssl-rand-hex-32}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:9000,http://2.25.142.139:9000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./content:/app/content
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  admin:
    build: ../admin-panel
    ports:
      - "9000:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-appuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-apppass}
      - POSTGRES_DB=${DB_NAME:-appenglish}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appenglish}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
