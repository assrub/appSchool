name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  admin-panel-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd admin-panel
          npm install
      
      - name: Build
        run: |
          cd admin-panel
          npm run build
